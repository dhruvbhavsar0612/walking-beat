name: FoGCue
options:
  bundleIdPrefix: com.example.fogcue
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 7WK6W7T5HK
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
packages:
  FoGCore:
    path: Packages/FoGCore
targets:
  FoGCue:
    type: application
    platform: iOS
    sources: [PhoneApp/Sources, {path: PhoneApp/Resources, buildPhase: resources}, {path: PhoneApp/Assets.xcassets}]
    dependencies:
      - package: FoGCore
        product: FoGCore
      - package: FoGCore
        product: FoGKit
      - target: FoGCueWatch
    info:
      path: PhoneApp/Info.plist
      properties:
        CFBundleDisplayName: Walking Beat
        CFBundleShortVersionString: "2.6"
        CFBundleVersion: "17"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSMotionUsageDescription: Walking Beat measures your motion during walk mode and the setup walk to detect freezing and set your beat tempo.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fogcue
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  FoGML:
    type: application
    platform: iOS
    sources:
      - path: MLApp/Sources
      - path: MLApp/Resources
        buildPhase: sources # .mlmodel must be compiled by coremlc to generate the class
      - path: MLApp/Assets.xcassets
    info:
      path: MLApp/Info.plist
      properties:
        CFBundleDisplayName: Walking Beat ML
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMotionUsageDescription: The ML comparison app measures motion to evaluate a random-forest freezing detector.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fogcue.ml
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  FoGCueWatch:
    type: application
    platform: watchOS
    sources: [WatchApp/Sources, {path: WatchApp/Assets.xcassets}]
    dependencies:
      - package: FoGCore
        product: FoGCore
      - package: FoGCore
        product: FoGKit
      - sdk: HealthKit.framework
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Walking Beat
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.fogcue
        WKBackgroundModes: [workout-processing]
        NSMotionUsageDescription: Used to notice when walking suddenly stops so the walking beat can start.
        NSHealthShareUsageDescription: Walk sessions run as a workout so the watch keeps listening with the screen off.
        NSHealthUpdateUsageDescription: Walk sessions run as a workout so the watch keeps listening with the screen off. Workouts are not saved.
    entitlements:
      path: WatchApp/FoGCueWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fogcue.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
